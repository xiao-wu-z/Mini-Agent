[project]
name = "mini-agent"
version = "0.1.0"
description = "Mini Agent FastAPI service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncmy>=0.2,<0.3",
    "cryptography>=44",
    "alembic>=1.14,<2",
    "redis>=5,<8",
    "httpx>=0.28,<1.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1.0",
]

[tool.fastapi]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
